[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maxrescue"
version = "0.1.0"
description = "MaxRescue — headless memory reduction for oversized 3ds Max scenes. Renders untouched."
authors = [{ name = "Aasish Muchala" }]
requires-python = ">=3.10"
dependencies = ["olefile>=0.46"]

[project.optional-dependencies]
dev = ["pytest>=8"]
app = ["PySide6>=6.5"]

[project.scripts]
maxrescue = "maxrescue.app.cli:main"

[project.gui-scripts]
maxrescue-app = "maxrescue.ui.app:main"

[tool.setuptools.packages.find]
include = ["maxrescue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
